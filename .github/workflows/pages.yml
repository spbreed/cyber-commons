name: Deploy Cyber Commons site

on:
  push:
    # main is the normal source; the development branch is included so the site
    # can be published before the branch is merged.
    branches:
      - main
      - 'claude/**'
    paths:
      # anything that can change what the site shows
      - 'site/**'
      - 'lessons/**'
      - 'labs/notebooks/**'
      - 'labs/cybercommons/**'
      - 'curriculum/labs.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No credential may reach the tree. Runs first so a leak fails fast.
      - name: Secret scan
        run: python3 scripts/check_secrets.py

      # Every notebook actually runs, top to bottom, self-contained. This is
      # the evidence behind the "✓ Executed" badge on each lesson page, and it
      # is the only correctness gate the labs need now that each notebook
      # carries its own code.
      - name: Execute every notebook
        run: python3 scripts/run_notebooks.py --quiet

      # The skills are lesson material and real agent configuration at once.
      # A skill whose frontmatter will not parse cannot be loaded, and two
      # skills whose descriptions collide route by sort order rather than by
      # meaning.
      - name: Validate agent skills
        run: python3 scripts/check_skills.py --check

      # And loading is not running. Every skill's own script is executed in a
      # stripped environment — no model endpoint, no cloud credentials — so a
      # skill that quietly depends on one, or that runs and prints nothing,
      # fails here rather than on a reader's machine.
      - name: Execute every agent skill
        run: python3 scripts/test_skills.py --check

      # Running clean is not enough — a lesson is only evidence if the
      # reader's run matches the one on the page. Two notebooks once printed
      # different things on Kaggle than they did locally because their output
      # depended on PYTHONHASHSEED, which a single local pass cannot reveal.
      - name: Check every notebook is deterministic
        run: python3 scripts/check_determinism.py --seeds 4 --quiet

      - name: Check notebooks and lab blocks are in sync
        run: |
          python3 scripts/build_notebooks.py --check
          python3 scripts/relink_labs.py --check

      # Every lesson carries a hook, a diagram rendered before any code, and —
      # if it closes a chapter — a bridge naming what it still cannot do. See
      # LESSON_DESIGN.md for why each of those is a rule rather than a habit.
      - name: Check lessons against the authoring contract
        run: python3 scripts/check_lessons.py --check

      # The incident register assigns every control from the source report to a
      # lesson that teaches it. Renumber a lesson and the register points at
      # nothing; edit one copy of it and the notebook disagrees with the file.
      - name: Check the incident control register
        run: python3 scripts/check_register.py --check

      - name: Install the diagram renderers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz plantuml

      - name: Render and validate every diagram a skill emits
        run: python3 scripts/render_diagrams.py --check

      - name: Check the documentation's counted claims against the tree
        run: python3 scripts/check_claims.py --check

      - name: Build lesson pages
        run: |
          pip install --quiet markdown
          python3 scripts/build_site.py
          # if the commit did not include the regenerated pages, say so loudly.
          # index.html is in here too: its chapter grid and every count in its
          # copy are generated, and it advertised the wrong lesson count for
          # two chapters before this check existed.
          if ! git diff --quiet -- site/lessons site/index.html; then
            echo "::warning::site was out of date and has been rebuilt for this deploy."
            echo "::warning::Run 'python3 scripts/build_site.py' before committing to keep the repo in sync."
          fi

      - name: Validate curriculum + videos data
        run: |
          python3 - <<'PY'
          import json, sys
          cur = json.load(open('site/data/curriculum.json'))
          vid = json.load(open('site/data/videos.json'))
          ids = set()
          for fn in cur['functions']:
              for tr in fn['tracks']:
                  ids |= {s['id'] for s in tr['sessions']}
          bad = [k for k in vid.get('videos', {}) if k not in ids]
          if bad:
              print(f"::error::videos.json references unknown session ids: {bad}")
              sys.exit(1)
          print(f"ok: {len(ids)} sessions, {len(vid.get('videos', {}))} with recordings")
          PY

      # ONE-TIME MANUAL STEP: Settings → Pages → Source: "GitHub Actions".
      # The workflow's GITHUB_TOKEN cannot create the Pages site itself
      # ("Resource not accessible by integration" — site creation needs repo
      # admin), and Pages on a PRIVATE repo additionally requires a paid plan.
      # Once the site exists, every push here deploys it automatically.
      # The custom domain has to travel WITH the artifact. Settings → Pages
      # holds a copy, but an Actions deploy publishes whatever the artifact
      # contains, and an artifact with no CNAME can clear the setting — after
      # which cybercommons.ai serves nothing and the .github.io URL stops
      # redirecting. Keeping the file in site/ makes the domain part of the
      # build rather than a value in a web form nobody can diff.
      - name: The published artifact must carry the custom domain
        run: |
          test -f site/CNAME || { echo "::error::site/CNAME is missing — a deploy \
          without it can clear the custom domain in Settings → Pages"; exit 1; }
          echo "custom domain in artifact: $(cat site/CNAME)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
