name: Deploy Cyber Commons site

on:
  push:
    # master is the trunk and the branch every published link points at (see
    # scripts/exercises/repo.py). `main` is kept only because it costs nothing
    # and a repository that grows one later should still deploy. Development
    # branches are included so the site can be published before a merge —
    # without that, pushing master alone would have deployed nothing, because
    # this list did not mention it.
    branches:
      - master
      - main
      - 'claude/**'
    paths:
      # anything that can change what the site shows
      - 'site/**'
      - 'lessons/**'
      - 'skills/**'
      - 'labs/cybercommons/**'
      - 'curriculum/labs.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No credential may reach the tree. Runs first so a leak fails fast.
      - name: Secret scan
        run: python3 scripts/check_secrets.py

      # The skills are lesson material and real agent configuration at once.
      # A skill whose frontmatter will not parse cannot be loaded, and two
      # skills whose descriptions collide route by sort order rather than by
      # meaning.
      - name: Validate agent skills
        run: python3 scripts/check_skills.py --check

      # And loading is not running. Every skill's own script is executed in a
      # stripped environment — no model endpoint, no cloud credentials — so a
      # skill that quietly depends on one, or that runs and prints nothing,
      # fails here rather than on a reader's machine.
      - name: Execute every agent skill
        run: python3 scripts/test_skills.py --check

      # A model is not deterministic, so this does not claim a lesson's
      # findings reproduce. What it checks is the half that is ours: with no
      # model reachable every skill refuses, and that refusal must be identical
      # across hash seeds. One that varies means something unordered reached
      # the message — a set iterated into a sort, a dict printed directly — and
      # the same defect would make every real result undiffable too.
      - name: Check the skill harness is deterministic
        run: python3 scripts/check_determinism.py --seeds 4 --quiet

      # The skills are symlinked into each agent CLI, flattened, so two areas
      # claiming one skill name would silently drop one of them at install
      # time. The installer refuses rather than guessing; this runs that check
      # without writing anything.
      - name: Check the skills install cleanly into an agent CLI
        run: python3 scripts/install_skills.py --tool claude --dry-run

      # Every lesson carries a hook, a diagram rendered before any code, and —
      # if it closes a chapter — a bridge naming what it still cannot do. See
      # LESSON_DESIGN.md for why each of those is a rule rather than a habit.
      - name: Check lessons against the authoring contract
        run: python3 scripts/check_lessons.py --check

      # The incident register assigns every control from the source report to a
      # lesson that teaches it. Renumber a lesson and the register points at
      # nothing; edit one copy of it and the embedded copy disagrees with the
      # file. Its ids are C1.1-C10.4, syntactically identical to lesson ids.
      - name: Check the incident control register
        run: python3 scripts/check_register.py --check

      # A reader outside your head cannot resolve an idiom or a weekday used to
      # mean "at any time". This is the rule-decidable half of the reading pass
      # in scripts/judge_content.py, which needs a model and a key and so does
      # not run here.
      - name: Check the prose for phrasing a reader must decode
        run: python3 scripts/check_clarity.py --check

      # Text that is present, correct and invisible. A white-theme change left
      # a dark-theme `pre` behind, a later rule gave every `code` a light pill
      # background, and fenced blocks rendered pale blue on near-white — the
      # `git clone` lines and every SKILL.md frontmatter were unreadable with a
      # green build. No rule catches that: each declaration is fine alone. So
      # the pages are rendered and measured. Skipped where there is no browser.
      - name: Check every page for text nobody can read
        run: python3 scripts/check_contrast.py --all --check

      - name: Install the diagram renderers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz plantuml

      - name: Render and validate every diagram a skill emits
        run: python3 scripts/render_diagrams.py --check

      - name: Check the documentation's counted claims against the tree
        run: python3 scripts/check_claims.py --check

      # A reader opening the commons mid-curriculum needs cybertravels/ as it
      # stood then — everything taught so far and nothing taught later. The
      # checkpoints are derived from the finished tree by step: markers, so the
      # way they rot is silent: the markers drift out of step with the code and
      # every other gate still passes. This compares the last checkpoint with
      # the committed tree using a second, deliberately dumb implementation of
      # the same rule, parses all 148, and refuses a `was` branch that is not
      # commented out — which would make the committed application run the
      # naive code as well as the real code.
      - name: Check every lesson checkpoint materialises
        run: python3 scripts/checkpoint.py --check

      # Parsing proves a checkpoint is syntactically whole; this proves it
      # works, which is the claim a reader depends on. It caught two `was`
      # branches in db.audit binding the wrong number of values at any
      # checkpoint with one of the two lessons applied and not the other —
      # every checkpoint parsed, and A2.4 raised at the first INSERT.
      #
      # PyJWT only. The app's other dependencies are not needed: the smoke
      # test runs no server and calls no model, which is why it is the thing
      # worth running 148 times.
      - name: Run every checkpoint's own smoke test
        run: |
          pip install --quiet PyJWT
          python3 scripts/checkpoint.py --run

      # LABELS.md is the hand-written key four AppSec skills score recall and
      # precision against, and those skills hard-code the unit names — a key
      # derived by running a scanner would not be a key. So a rename in
      # cybertravels/ could leave them measuring against functions that no
      # longer exist, with every number wrong and nothing failing.
      - name: Check the ground-truth labels still describe the tree
        run: python3 scripts/check_labels.py --check

      # A context file that has drifted is read with the same confidence as a
      # correct one. check_claims covers its numbers; this covers its structure
      # — every script it names exists, and its gate table and this workflow
      # agree in both directions.
      - name: Check CLAUDE.md against the repository it describes
        run: python3 scripts/check_claude_md.py --check

      # The other fifty-odd markdown files, which nothing covered: every
      # relative link resolves, no link points at a retired lesson, every
      # scripts/*.py named exists, and the site is cited at its own domain.
      # Added after an audit found all four classes live in the tree at once.
      - name: Check every markdown file against the tree it describes
        run: python3 scripts/check_docs.py --check

      # The fifteen chapter docs are generated from curriculum.json and
      # committed, and until now nothing compared them against it. A fix to
      # "a system that changed on Tuesday" reached the JSON and the rendered
      # page and sat uncorrected here, where check_clarity could not see it —
      # that gate reads the site.
      - name: Check the chapter docs are in step with the curriculum
        run: python3 scripts/build_curriculum.py --check

      # Every published link into this repository carries a branch name. One
      # had drifted to a branch that has never existed on the remote and
      # returned 404 as an ordinary-looking link — between check_docs (markdown,
      # relative links) and check_claude_md (one file), nothing looked at an
      # absolute GitHub URL inside a .py lesson source.
      - name: Check every repository link pins the published branch
        run: python3 scripts/check_repo_links.py --check

      # The recording scripts are generated from the lesson sources. If a
      # lesson changes and this is not regenerated, somebody records a script
      # for a lesson that no longer says that.
      - name: Check the lightboard scripts are in step with the lessons
        run: python3 scripts/build_lightboard.py --check

      - name: Every lesson's framework labels must resolve, and be real
        run: python3 scripts/check_frameworks.py

      # A label that links to a 404 costs more trust than a label with no link.
      # Frameworks renumber their URLs, so this is a live fetch, not a one-off.
      #
      # It is the only step here that depends on the public internet, and it is
      # therefore the only one that can fail for a reason that has nothing to do
      # with the commit. The script already downgrades DNS, TLS and timeout
      # errors to warnings — but an egress proxy answering 403 or 407 raises an
      # HTTPError, which it cannot tell from a genuinely dead link, so it exits
      # non-zero and the deploy never runs. A site frozen on last week's build
      # because someone else's CDN had a bad minute is the worse failure.
      #
      # continue-on-error keeps the check running and still marks the step
      # failed in the Actions UI, so a real dead link is visible — it just no
      # longer holds the site hostage. Read this step on any run where a
      # framework URL has actually moved.
      - name: Every framework label must link somewhere that exists
        continue-on-error: true
        run: python3 scripts/check_framework_links.py

      - name: Build lesson pages
        run: |
          pip install --quiet markdown
          python3 scripts/build_site.py
          # if the commit did not include the regenerated pages, say so loudly.
          # index.html is in here too: its chapter grid and every count in its
          # copy are generated, and it advertised the wrong lesson count for
          # two chapters before this check existed.
          if ! git diff --quiet -- site/lessons site/index.html; then
            echo "::warning::site was out of date and has been rebuilt for this deploy."
            echo "::warning::Run 'python3 scripts/build_site.py' before committing to keep the repo in sync."
          fi

      - name: Validate curriculum + videos data
        run: |
          python3 - <<'PY'
          import json, sys
          cur = json.load(open('site/data/curriculum.json'))
          vid = json.load(open('site/data/videos.json'))
          ids = set()
          for fn in cur['functions']:
              for tr in fn['tracks']:
                  ids |= {s['id'] for s in tr['sessions']}
          bad = [k for k in vid.get('videos', {}) if k not in ids]
          if bad:
              print(f"::error::videos.json references unknown session ids: {bad}")
              sys.exit(1)
          print(f"ok: {len(ids)} sessions, {len(vid.get('videos', {}))} with recordings")
          PY

      # ONE-TIME MANUAL STEP: Settings → Pages → Source: "GitHub Actions".
      # The workflow's GITHUB_TOKEN cannot create the Pages site itself
      # ("Resource not accessible by integration" — site creation needs repo
      # admin), and Pages on a PRIVATE repo additionally requires a paid plan.
      # Once the site exists, every push here deploys it automatically.
      # WHICH URL THIS DEPLOY SERVES — site/CNAME plus one repo setting.
      #
      #   site/CNAME present  -> every deploy (re)applies that custom domain,
      #                          and spbreed.github.io/cyber-commons/ 301s to it.
      #   site/CNAME absent   -> a deploy stops re-applying it, but it does NOT
      #                          clear a domain already stored in Settings ->
      #                          Pages. Measured: run 121 deployed with no
      #                          CNAME and the .github.io URL still 301'd.
      #                          Clearing it means emptying that field in the
      #                          web UI, or PATCH /repos/{o}/{r}/pages.
      #
      # It is present. cybercommons.ai resolves to 185.199.108-111.153 with
      # nothing else in the apex A record, www is a CNAME to spbreed.github.io,
      # the certificate issued on 2026-09-05 and Enforce HTTPS is on.
      #
      # The zone must stay at exactly those four addresses. A GoDaddy
      # forwarding or parking record added back does two things at once: it
      # round-robins a share of visitors onto a parking page, and it fails the
      # Let's Encrypt validation that renews the certificate every ~60 days —
      # so HTTPS would break weeks later, for a change nobody connects to it.
      - name: Say which URL this deploy will serve
        run: |
          if [ -f site/CNAME ]; then
            echo "custom domain: $(cat site/CNAME) — the .github.io URL will redirect to it"
          else
            echo "no custom domain — serving on the .github.io URL directly"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
