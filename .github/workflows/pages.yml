name: Deploy Cyber Commons site

on:
  push:
    # main is the normal source; the development branch is included so the site
    # can be published before the branch is merged.
    branches:
      - main
      - 'claude/**'
    paths:
      # anything that can change what the site shows
      - 'site/**'
      - 'lessons/**'
      - 'labs/notebooks/**'
      - 'labs/cybercommons/**'
      - 'curriculum/labs.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No credential may reach the tree. Runs first so a leak fails fast.
      - name: Secret scan
        run: python3 scripts/check_secrets.py

      # Every notebook actually runs, top to bottom, self-contained. This is
      # the evidence behind the "✓ Executed" badge on each lesson page, and it
      # is the only correctness gate the labs need now that each notebook
      # carries its own code.
      - name: Execute every notebook
        run: python3 scripts/run_notebooks.py --quiet

      # Running clean is not enough — a lesson is only evidence if the
      # reader's run matches the one on the page. Two notebooks once printed
      # different things on Kaggle than they did locally because their output
      # depended on PYTHONHASHSEED, which a single local pass cannot reveal.
      - name: Check every notebook is deterministic
        run: python3 scripts/check_determinism.py --seeds 4 --quiet

      - name: Check notebooks and lab blocks are in sync
        run: |
          python3 scripts/build_notebooks.py --check
          python3 scripts/relink_labs.py --check

      - name: Build lesson pages
        run: |
          pip install --quiet markdown
          python3 scripts/build_site.py
          # if the commit did not include the regenerated pages, say so loudly
          if ! git diff --quiet -- site/lessons; then
            echo "::warning::site/lessons was out of date and has been rebuilt for this deploy."
            echo "::warning::Run 'python3 scripts/build_site.py' before committing to keep the repo in sync."
          fi

      - name: Validate curriculum + videos data
        run: |
          python3 - <<'PY'
          import json, sys
          cur = json.load(open('site/data/curriculum.json'))
          vid = json.load(open('site/data/videos.json'))
          ids = set()
          for fn in cur['functions']:
              for tr in fn['tracks']:
                  ids |= {s['id'] for s in tr['sessions']}
          bad = [k for k in vid.get('videos', {}) if k not in ids]
          if bad:
              print(f"::error::videos.json references unknown session ids: {bad}")
              sys.exit(1)
          print(f"ok: {len(ids)} sessions, {len(vid.get('videos', {}))} with recordings")
          PY

      # ONE-TIME MANUAL STEP: Settings → Pages → Source: "GitHub Actions".
      # The workflow's GITHUB_TOKEN cannot create the Pages site itself
      # ("Resource not accessible by integration" — site creation needs repo
      # admin), and Pages on a PRIVATE repo additionally requires a paid plan.
      # Once the site exists, every push here deploys it automatically.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
